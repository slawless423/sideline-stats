name: Export Transfers Missing Roster

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run export script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/export_transfers_missing_roster.mjs

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfers-missing-roster
          path: rosters/transfers_missing_roster.csv
          retention-days: 7
