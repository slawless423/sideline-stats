name: Match Transfers

on:
  workflow_dispatch:

jobs:
  match-transfers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install xlsx

      - name: Run transfer matching script
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/match_transfers.mjs

      - name: Upload review file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-review
          path: scripts/transfer_review.json
          if-no-files-found: ignore
