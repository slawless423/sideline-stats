name: Scrape EYBL Scholastic Stats

on:
  workflow_dispatch:   # manual trigger only — run whenever you want to refresh

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install puppeteer cheerio pg

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Run EYBL scraper
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL }}
        run: node scripts/scrape_eybl.mjs
