name: Estimate 3SSB Missing Minutes (Dry Run)
on:
  workflow_dispatch:
    inputs:
      game_uuid:
        description: 'Game UUID to dry-run (try 234683, 234702, 234722, or 235789)'
        required: true
        type: choice
        options:
          - '234683'
          - '234702'
          - '234722'
          - '235789'
        default: '234683'
jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pg
        run: npm install pg
      - name: Run dry-run estimation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GAME_UUID: ${{ inputs.game_uuid }}
        run: node scripts/estimate_3ssb_dryrun.mjs
