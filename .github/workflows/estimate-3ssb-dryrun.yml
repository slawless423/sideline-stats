name: Estimate 3SSB Missing Minutes (Dry Run)
on:
  workflow_dispatch:
    inputs:
      game_uuid:
        description: 'Optional: single game UUID to drill into. Leave blank to process ALL broken games.'
        required: false
        default: ''
jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pg
        run: npm install pg
      - name: Run dry-run estimation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GAME_UUID: ${{ inputs.game_uuid }}
        run: node scripts/estimate_3ssb_dryrun.mjs
