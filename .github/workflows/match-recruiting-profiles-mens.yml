name: High School Profile Matching (Boys)

on:
  workflow_dispatch:

jobs:
  match-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run matching script
        env:
          SITE_URL: https://sideline-stats.com
        run: node scripts/match_recruiting_profiles_mens.mjs

      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Update unified recruiting profiles (men''s)'
          title: 'High School Profile Matching (Boys)'
          body: |
            Automated update of `lib/recruiting/unified_profiles_men.json`.

            **Review the diff** for:
            - Newly auto-matched profiles (`match_confidence: "exact"`)
            - New entries in `pending_review` — for each one, decide whether to:
              1. Approve: copy the entry into `profiles`, set `match_confidence: "manually_confirmed"`, fill in canonical `grad_year` / `height_inches`, then remove from `pending_review`.
              2. Reject: split the sources into separate single-source profile entries (or leave it pending).

            Generated by `.github/workflows/match-recruiting-profiles-mens.yml`.
          branch: profile-matching/mens
          delete-branch: true
