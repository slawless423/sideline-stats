name: Apply Profile Match Decisions (Boys)

on:
  workflow_dispatch:

jobs:
  apply-decisions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run apply-decisions script
        run: node scripts/apply_profile_decisions_mens.mjs

      - name: Open PR with applied decisions
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Apply profile match decisions (men''s)'
          title: 'Apply Profile Match Decisions (Boys)'
          body: |
            Applies decisions from `data/profile_decisions_men.csv` to `lib/recruiting/unified_profiles_men.json`.

            **What changed:**
            - APPROVE rows became `match_confidence: "manually_confirmed"` profiles
            - SPLIT rows became one `manually_confirmed` profile per source row
            - SKIP / blank rows stayed in `pending_review` for next time

            Processed rows have been removed from the CSV so it's ready for the next batch.

            Generated by `.github/workflows/apply-profile-decisions-mens.yml`.
          branch: profile-decisions/mens
          delete-branch: true
