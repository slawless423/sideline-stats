name: Scrape NJCAA D1 Stats

on:
  workflow_dispatch:
    inputs:
      gender:
        description: 'Gender to scrape'
        required: true
        default: 'womens'
        type: choice
        options:
          - womens
          - mens
          - both

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Scrape womens
        if: ${{ github.event.inputs.gender == 'womens' || github.event.inputs.gender == 'both' }}
        run: node scripts/scrape-njcaa-boxscores.js --gender womens
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Scrape mens
        if: ${{ github.event.inputs.gender == 'mens' || github.event.inputs.gender == 'both' }}
        run: node scripts/scrape-njcaa-boxscores.js --gender mens
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
